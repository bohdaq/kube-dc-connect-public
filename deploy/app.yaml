# The app on kube-dc: a Deployment and a ClusterIP Service that the platform
# publishes over HTTPS (hostname + certificate, no public IP). Rendered by
# deploy/deploy.sh with envsubst: APP, IMAGE, PORT. Generated by the kube-dc
# MCP tool connect_repository; adjust resources and probes to the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP}
  labels: { app: ${APP} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ${APP} }
  template:
    metadata:
      labels: { app: ${APP} }
    spec:
      imagePullSecrets:
        - name: ${APP}-pull
      containers:
        - name: app
          image: ${IMAGE}
          ports:
            - { name: http, containerPort: ${PORT} }
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: ${APP}
  annotations:
    service.nlb.kube-dc.com/expose-route: https
    service.nlb.kube-dc.com/https-redirect: "true"
spec:
  type: ClusterIP
  selector: { app: ${APP} }
  ports:
    - { name: http, port: 80, targetPort: http }
